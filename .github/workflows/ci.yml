name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run tests (offline mock mode, hashing embeddings)
        env:
          LLM_PROVIDER: mock
          EMBEDDING_BACKEND: hashing
        run: pytest
